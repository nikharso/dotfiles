# Hunk (https://hunk.dev) — terminal diff viewer.
#
# Hunk has no light/dark pair for custom themes: `theme = "auto"` only ever
# resolves to github-light-default / github-dark-default, and user themes can
# not shadow built-in ids. So both palettes are defined here and selected from
# the outside with `--theme`, by git/hunk-theme. This value is the fallback
# for a bare `hunk diff` run outside git.
theme = "maxx-mellow"

# ----------------------------------------------------------- dark ----------
# Mirrors ghostty/themes/maxx-mellow and nvim/colors/maxx-mellow.lua.

[themes.maxx-mellow]
base  = "github-dark-default"
label = "Maxx Mellow"

background   = "#161617"
panel        = "#1b1b1d"
panelAlt     = "#202022"
border       = "#353539"
accent       = "#92a2d5"
accentMuted  = "#6b76a0"
text         = "#c9c7cd"
muted        = "#77767c"

addedBg           = "#1e2a22"
removedBg         = "#2c1c22"
addedContentBg    = "#27392d"
removedContentBg  = "#3d2430"
movedAddedBg      = "#1c2630"
movedRemovedBg    = "#2a2233"
contextBg         = "#161617"
contextContentBg  = "#1b1b1d"
addedSignColor    = "#90b99f"
removedSignColor  = "#ea83a5"

lineNumberBg = "#1b1b1d"
lineNumberFg = "#5c5b60"
selectedHunk = "#2a2a2e"

badgeAdded   = "#90b99f"
badgeRemoved = "#ea83a5"
badgeNeutral = "#85b5ba"

fileNew       = "#90b99f"
fileDeleted   = "#ea83a5"
fileRenamed   = "#92a2d5"
fileModified  = "#e6b99d"
fileUntracked = "#aca1cf"

noteBorder          = "#353539"
noteBackground      = "#1b1b1d"
noteTitleBackground = "#202022"
noteTitleText       = "#c9c7cd"

[themes.maxx-mellow.syntax_scopes]
"comment"              = "#6e6d73"
"string"               = "#90b99f"
"constant.numeric"     = "#e6b99d"
"constant.language"    = "#e6b99d"
"keyword"              = "#aca1cf"
"storage"              = "#aca1cf"
"entity.name.function" = "#92a2d5"
"entity.name.type"     = "#85b5ba"
"entity.name.tag"      = "#ea83a5"
"variable"             = "#c9c7cd"
"variable.parameter"   = "#b7aed5"
"support.function"     = "#92a2d5"

# ----------------------------------------------------------- light ---------
# Mirrors ghostty/themes/maxx-mellow-dawn and nvim/colors/maxx-mellow-dawn.lua.

[themes.maxx-mellow-dawn]

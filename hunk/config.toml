panel        = "#ebe8e5"
panelAlt     = "#e5e2de"
border       = "#c9c5c0"
accent       = "#5f6fb0"
accentMuted  = "#8f9bc8"
text         = "#52505a"
muted        = "#85818b"

addedBg           = "#e2eee6"
removedBg         = "#f6e3ea"
addedContentBg    = "#cde3d5"
removedContentBg  = "#eecdd9"
movedAddedBg      = "#e4e9f2"
movedRemovedBg    = "#ece7f2"
contextBg         = "#f4f2f0"
contextContentBg  = "#ebe8e5"
addedSignColor    = "#4c7a5c"
removedSignColor  = "#a3506f"

lineNumberBg = "#ebe8e5"
lineNumberFg = "#9a959d"
selectedHunk = "#e0ddd9"

badgeAdded   = "#588368"
badgeRemoved = "#b25c7e"
badgeNeutral = "#4d868b"

fileNew       = "#588368"
fileDeleted   = "#b25c7e"
fileRenamed   = "#5f6fb0"
fileModified  = "#a9744f"
fileUntracked = "#7c70a8"

noteBorder          = "#c9c5c0"
noteBackground      = "#ebe8e5"
noteTitleBackground = "#e5e2de"
noteTitleText       = "#52505a"

[themes.maxx-mellow-dawn.syntax_scopes]
"comment"              = "#8b8792"
"string"               = "#588368"
"constant.numeric"     = "#a9744f"
"constant.language"    = "#a9744f"
"keyword"              = "#7c70a8"
"storage"              = "#7c70a8"
"entity.name.function" = "#5f6fb0"
"entity.name.type"     = "#4d868b"
"entity.name.tag"      = "#b25c7e"
"variable"             = "#52505a"
"variable.parameter"   = "#6f6299"
"support.function"     = "#5f6fb0"
